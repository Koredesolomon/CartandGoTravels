name: cartandgo-development

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env.development.local}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env.development.local}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.development.local}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Set LOCAL_MYSQL_ROOT_PASSWORD in .env.development.local}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/payment-redemptions.sql:/docker-entrypoint-initdb.d/payment-redemptions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT transaction_id FROM payment_redemptions LIMIT 0'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  mysql-data:
